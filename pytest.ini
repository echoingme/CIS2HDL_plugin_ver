[pytest]
# Test paths and discovery
testpaths = tests
norecursedirs = _archive .git __pycache__ .pytest_cache *.egg-info

# Custom markers (CODING_STANDARDS.md §7.1)
markers =
    unit: Unit tests — single module/func, no I/O
    integration: Integration tests — multiple modules interacting
    e2e: End-to-end tests — full pipeline with real fixtures
    slow: Slow-running tests (real DSN parsing, full pipeline)

# Output
addopts = -v --tb=short
