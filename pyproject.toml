[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cis2hdl"
version = "0.3.5"
description = "OrCAD Capture CIS to Design Entry HDL Schematic Converter"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "CIS2HDL Team"}]
keywords = ["eda", "orcad", "capture-cis", "concept-hdl", "schematic-converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "pydantic>=2.0",
    "sexpdata>=1.0",
    "pyside6>=6.5",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pyinstaller>=6.0",
]

[project.scripts]
cis2hdl = "cis2hdl.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
